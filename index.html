<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網頁設計作品集 🌸</title>
    <style>
        /* ==================== 基礎與全域設定 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #e8f0fe 50%, #fff0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            color: #5a4b51;
            position: relative;
            overflow-x: hidden;
        }

        /* 裝飾性漂浮小圓圈/氣泡 */
        body::before, body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            z-index: 0;
            animation: float 6s ease-in-out infinite alternate;
        }
        body::before {
            width: 250px;
            height: 250px;
            top: -50px;
            left: -50px;
        }
        body::after {
            width: 300px;
            height: 300px;
            bottom: -80px;
            right: -80px;
            animation-delay: -3s;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(20px) rotate(10deg); }
        }

        /* 主容器 */
        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(230, 160, 185, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.8);
            position: relative;
            z-index: 1;
            text-align: center;
        }

        /* ==================== 個人資料區域 ==================== */
        .profile-section {
            margin-bottom: 35px;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px auto;
        }

        /* 頭像外圍的光暈旋轉動畫 */
        .avatar-wrapper::before {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd, #c2e9fb);
            z-index: -1;
            animation: rotateGlow 4s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.08) rotate(5deg);
        }

        .user-name {
            font-size: 1.8rem;
            color: #6c5ce7;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #887a8b;
            background: #ffe3ed;
            display: inline-block;
            padding: 5px 16px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* ==================== 16個按鈕網格區域 ==================== */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-top: 25px;
        }

        /* 萬用卡片基礎樣式 */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 18px 12px;
            border-radius: 20px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            min-height: 100px;
            user-select: none;
        }

        /* --- 1. 已解鎖卡片樣式 --- */
        .card.unlocked {
            background: linear-gradient(135deg, #ffffff 0%, #fff0f6 100%);
            border: 2px solid #ffb6c1;
            box-shadow: 0 6px 15px rgba(255, 182, 193, 0.3);
            cursor: pointer;
        }

        .card.unlocked .card-title {
            color: #d81b60;
            font-size: 1rem;
            font-weight: 700;
        }

        .card.unlocked .card-desc {
            color: #7a5265;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        /* 已解鎖 Hover 動畫：浮起 + 流光掃過效果 */
        .card.unlocked::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.6) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            transition: all 0.6s ease;
        }

        .card.unlocked:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 12px 22px rgba(216, 27, 96, 0.25);
            border-color: #ff69b4;
            background: linear-gradient(135deg, #ffffff 0%, #ffe4e1 100%);
        }

        .card.unlocked:hover::after {
            left: 120%;
        }

        /* --- 2. 未解鎖卡片樣式 (灰色/鎖頭) --- */
        .card.locked {
            background: #f0edf2;
            border: 2px dashed #d1c7d7;
            color: #a399ab;
            cursor: not-allowed;
            opacity: 0.85;
        }

        .card.locked .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #8e8395;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card.locked .lock-icon {
            font-size: 1.1rem;
            transition: transform 0.3s ease;
        }

        .card.locked .card-desc {
            font-size: 0.8rem;
            color: #b5abbd;
            margin-top: 4px;
        }

        /* 未解鎖 Hover 動畫：微搖晃 + 鎖頭放大 */
        .card.locked:hover {
            background: #e6e1ea;
            border-color: #bfaec9;
            transform: translateY(-2px);
        }

        .card.locked:hover .lock-icon {
            transform: scale(1.3) rotate(-10deg);
        }

        /* ==================== 響應式排版 (RWD) ==================== */
        /* 平板尺寸 (少於 768px)：改為 3 欄 */
        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }

        /* 手機尺寸 (少於 500px)：改為 2 欄 */
        @media (max-width: 500px) {
            .container {
                padding: 30px 18px;
            }
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .user-name {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
